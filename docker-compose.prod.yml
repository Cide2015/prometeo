# docker-compose.prod.yml — Prometeo (Plataforma SaaS Multi-Tenant de Licitaciones)
# Despliegue productivo. Convención CIDE. SRV01 (100.70.173.34).
# Arquitectura Zero Trust: NPM/Cloudflare enrutan a prometeo-nginx; nada expone puertos al host.

services:
  # Proxy Inverso Nginx — Punto Único de Entrada interno
  nginx:
    container_name: prometeo-nginx
    image: nginx:alpine
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certs:/etc/ssl/certs:ro
    depends_on:
      - app
    networks:
      - npm-network
      - prometeo-internal-network

  # Frontend Next.js — Landing + SaaS Hub (7 módulos)
  app:
    container_name: prometeo-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ADMIN_API_URL=${NEXT_PUBLIC_ADMIN_API_URL:-https://admin.cidesolutions.com/api}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:3001}
      - NEXT_PUBLIC_APP_NAME=Prometeo
    depends_on:
      - backend
    networks:
      - npm-network
      - prometeo-internal-network

  # Backend API Core — NestJS (multi-tenant, RLS, orquestación de agentes)
  backend:
    container_name: prometeo-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_API_URL=${ADMIN_API_URL:-https://admin.cidesolutions.com/api}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ADMIN_APP_PRODUCT_CODE=${ADMIN_APP_PRODUCT_CODE:-APP004}
      - LICENSE_SYNC_SECRET=${LICENSE_SYNC_SECRET}
      - SODA_APP_TOKEN=${SODA_APP_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets:
      - jwt_secret
      - postgres_password
      - admin_api_key
      - license_sync_secret
    networks:
      - prometeo-internal-network

  # Base de Datos PostgreSQL 16 + pgvector (multi-tenant RLS)
  db:
    container_name: prometeo-db
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prometeo-internal-network

  # Backup Automático (patrón Armonia: pg_dump + retención 7 días)
  db-backup:
    container_name: prometeo-db-backup
    image: postgres:16-alpine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - BACKUP_DIR=/backups
    volumes:
      - backups_data:/backups
    command: >
      sh -c "echo 'Iniciando servicio de backup...'; while true; do
        echo 'Generando backup...';
        FILENAME=prometeo_backup_$$(date +%Y%m%d_%H%M%S).sql;
        pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} > /backups/$$FILENAME;
        SIZE=$$(du -h /backups/$$FILENAME | cut -f1);
        echo 'Backup completado: ' $$FILENAME ' - Tamaño: ' $$SIZE;
        find /backups -name 'prometeo_backup_*.sql' -mtime +7 -delete;
        echo 'Esperando 24h...';
        sleep 86400;
      done"
    networks:
      - prometeo-internal-network

  # Caché y Cola de Tareas — Redis 7
  redis:
    container_name: prometeo-redis
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    networks:
      - prometeo-internal-network

  # Orquestador de Workflows — n8n (ingesta SECOP, correo RFI/RFP, alertas)
  n8n:
    container_name: prometeo-n8n
    image: n8nio/n8n:latest
    restart: always
    expose:
      - "5678"
    environment:
      - N8N_HOST=${N8N_HOST:-prometeo.cidesolutions.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://prometeo.cidesolutions.com/webhook}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_DATABASE:-prometeo_n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - prometeo-internal-network

volumes:
  db_data:
  redis_data:
  backups_data:
  n8n_data:

networks:
  npm-network:
    external: true
    name: red_publica
  prometeo-internal-network:
    driver: bridge

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  postgres_password:
    file: ./secrets/postgres_password
  admin_api_key:
    file: ./secrets/admin_api_key
  license_sync_secret:
    file: ./secrets/license_sync_secret
